# This is a test workflow to verify the Python client nightly build approach.
# It mirrors the Python client steps in nightly.yml but skips the actual PyPI publish.

name: "Python Client Nightly Test"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/python-client-nightly-test.yml'
      - '.github/workflows/python-client-build-artifacts.yml'
      - '.github/workflows/nightly.yml'

jobs:
  python-client-snapshot-build:
    uses: ./.github/workflows/python-client-build-artifacts.yml

  python-client-snapshot-publish-test:
    runs-on: ubuntu-latest
    needs: python-client-snapshot-build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.python-client-snapshot-build.outputs.artifact-name }}
          path: dist/

      - name: List artifacts
        run: |
          echo "Artifact name: ${{ needs.python-client-snapshot-build.outputs.artifact-name }}"
          echo "Contents of dist/:"
          ls -la dist/
          echo ""
          echo "Wheel files:"
          ls -la dist/*.whl 2>/dev/null || echo "No wheel files found"
          echo ""
          echo "Source distributions:"
          ls -la dist/*.tar.gz 2>/dev/null || echo "No sdist files found"

      - name: Verify artifacts
        run: |
          # Verify we have the expected files
          WHEEL_COUNT=$(ls dist/*.whl 2>/dev/null | wc -l)
          SDIST_COUNT=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          echo "Found $WHEEL_COUNT wheel files and $SDIST_COUNT source distributions"
          
          if [ "$WHEEL_COUNT" -eq 0 ]; then
            echo "ERROR: No wheel files found!"
            exit 1
          fi
          
          if [ "$SDIST_COUNT" -eq 0 ]; then
            echo "ERROR: No source distribution found!"
            exit 1
          fi
          
          echo "SUCCESS: Artifacts are ready for PyPI publish"
