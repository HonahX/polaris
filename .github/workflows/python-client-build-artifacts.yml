name: "Build Python Client Artifacts"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (use dev-<date>-<short-sha> for nightly builds)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Optional version override (use dev-<date>-<short-sha> for nightly builds)'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/python-client-build-artifacts.yml'
      - 'client/python/**'

permissions:
  contents: read

jobs:
  build-artifacts:
    name: Build artifacts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-14, macos-15 ] # current build script is not compatible with windows

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK for openapi-generator-cli
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Resolve version input
        id: version-input
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_INPUT="${{ github.event.inputs.version }}"
          else
            VERSION_INPUT="${{ inputs.version }}"
          fi

          echo "value=${VERSION_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Apply version override
        if: steps.version-input.outputs.value != ''
        env:
          VERSION: ${{ steps.version-input.outputs.value }}
        run: make client-set-version VERSION="${VERSION}"

      - name: Capture client version
        id: client-version
        working-directory: ./client/python
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          content = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', content, re.MULTILINE)
          if not match:
            raise SystemExit("version not found in pyproject.toml")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"version={match.group(1)}\n")
          PY

      - name: Build source distribution
        run: make client-build FORMAT=sdist

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        with:
          output-dir: wheelhouse
          package-dir: "./client/python"
          config-file: "{package}/pyproject.toml"
        env:
          # Ignore 32 bit architectures
          CIBW_ARCHS: "auto64"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10,<3.14"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "" # Disable wheel repair since there will be no binary in the wheel
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: ""
          CIBW_ENVIRONMENT: POLARIS_CLI_SKIP_CLIENT_GENERATION="true" # java is not available in linux containers during wheel build, skip client generation

      - name: Add source distribution
        if: startsWith(matrix.os, 'ubuntu-24.04')
        run: ls -lah ./client/python/dist/* && cp ./client/python/dist/* wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: "python-client-build-${{ steps.client-version.outputs.version }}-${{ matrix.os }}"
          path: ./wheelhouse/*
          if-no-files-found: error

  merge-artifacts:
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: "python-client-build-${{ github.run_id }}"
          pattern: python-client-build-*
          delete-merged: true
