name: "Build Python Client Release SVN Artifacts"

on:
  workflow_call:
    inputs:
      VERSION:
        required: true
        type: string

jobs:
  svn-build-artifacts:
    name: Build artifacts for SVN on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025, macos-13, macos-14, macos-15]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13

      - name: Set up JDK for openapi-generator-cli
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build source distribution
        run: |
          make client-build SDIST_ONLY=true
        if: startsWith(matrix.os, 'ubuntu-24.04')

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.1.4
          
#      - name: Build wheels
#        uses: pypa/cibuildwheel@v3.1.4
#        with:
#          output-dir: wheelhouse
#          package-dir: "./client/python"
#          config-file: "./client/python/pyproject.toml"
#        env:
#          # Ignore 32 bit architectures
#          CIBW_ARCHS: "auto64"
#          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.9,<3.14"

      - name: Build wheels
        run:
          python -m cibuildwheel --output-dir wheelhouse --config-file "{package}/pyproject.toml" ./client/python
        env:
          # Ignore 32 bit architectures
          CIBW_ARCHS: "auto64"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.9,<3.14"

      - name: Add source distribution
        if: startsWith(matrix.os, 'ubuntu-24.04')
        run: ls -lah dist/* && cp dist/* wheelhouse/


      - uses: actions/upload-artifact@v4
        with:
          name: "python-client-svn-release-candidate-${{ matrix.os }}"
          path: ./wheelhouse/*

  svn-merge-artifacts:
    runs-on: ubuntu-latest
    needs:
      - svn-build-artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: "svn-release-candidate-${{ inputs.VERSION }}"
          pattern: svn-release-candidate*
          delete-merged: true
