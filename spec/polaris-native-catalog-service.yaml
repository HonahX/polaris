---
openapi: 3.0.3
info:
  title: Apache Polaris and Apache Iceberg REST Catalog API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1
  description:
    Defines the specification for the Polaris Catalog API, which encompasses both the Iceberg REST Catalog API
    and Polaris-native API.

# The server configuration is sourced from iceberg-rest-catalog-open-api.yaml
servers:
  - url: "{scheme}://{host}/{basePath}"
    description: Server URL when the port can be inferred from the scheme
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""
  - url: "{scheme}://{host}:{port}/{basePath}"
    description: Generic base server URL, with all parts configurable
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      port:
        description: The port used when addressing the host
        default: "443"
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""

# The security configuration is sourced from iceberg-rest-catalog-open-api.yaml
# All routes are currently configured using an Authorization header.
security:
  - OAuth2: []
  - BearerAuth: []

paths:

  /v1/{prefix}/namespaces/{namespace}/policies:
    parameters:
      - $ref: './common/parameters.yaml#/components/parameters/prefix'
      - $ref: './common/parameters.yaml#/components/parameters/namespace'

    post:
      tags:
        - Policy API
      summary: 'Create a policy in the given namespace'
      operationId: createPolicy
      description: |
        Creates a policy within the specified namespace.

        A policy defines a set of rules governing actions on specified resources under predefined conditions.
        In Apache Polaris, policies are created, stored, and later referenced by external engines to enforce access controls on associated resources.

        User provides the following inputs when creating a policy
        - `name`(REQUIRED): The name of the policy.
        - `type` (REQUIRED): The type of the policy.
          - **Predefined Policies:** policies have a `system.*` prefix in their type, such as `system.data_compaction`
        - `description` (OPTIONAL): Provides details about the policy's purpose and functionality
        - `content` (OPTIONAL): Defines the rules that control actions and access conditions on resources. The format can be JSON, SQL, or any other format.

        The policy content is validated against the policy's corresponding validator upon creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        200:
          $ref: '#/components/responses/CreatePolicyResponse'
        400:
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        419:
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'

    get:
      tags:
        - Policy API
      summary: List all policy identifiers underneath a given namespace
      description: Return all policy identifiers under this namespace
      operationId: listPolicies
      parameters:
        - $ref: './common/parameters.yaml#/components/parameters/page-token'
        - $ref: './common/parameters.yaml#/components/parameters/page-size'
        - $ref: '#/components/parameters/policy-type'

      responses:
        '200':
          $ref: '#/components/responses/ListPoliciesResponse'
        '400':
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        '403':
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        '404':
          description: Not Found - The namespace specified does not exist
          content:
            application/json:
              schema:
                $ref: './common/polaris-errors.yaml#/components/schemas/PolarisErrorModel'
              examples:
                NamespaceNotFound:
                  $ref: './common/polaris-errors.yaml#/components/examples/NoSuchNamespaceError'
        '419':
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        '503':
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'

  /v1/{prefix}/namespaces/{namespace}/policies/{policyName}:
    parameters:
      - $ref: './common/parameters.yaml#/components/parameters/prefix'
      - $ref: './common/parameters.yaml#/components/parameters/namespace'
      - $ref: '#/components/parameters/policy-name'

    get:
      tags:
        - Policy API
      summary: 'Get a policy'
      operationId: loadPolicy
      description: |
        Get a policy from the catalog
        
        The response contains the policy's metadata and content. For more details, refer to the definition of the `Policy` model.
      responses:
        200:
          $ref: '#/components/responses/LoadPolicyResponse'
        400:
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        404:
          description:
            Not Found - NoSuchPolicyException, policy to get does not exist
          content:
            application/json:
              schema:
                $ref: './common/polaris-errors.yaml#/components/schemas/PolarisErrorResponse'
              examples:
                PolicyToGetDoesNotExist:
                  $ref: '#/components/examples/NoSuchPolicyError'
        419:
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'

    put:
      tags:
        - Policy API
      summary: Update a policy
      operationId: updatePolicy
      description: |
        Update a policy
        
        A policy's description and content can be updated. The new content is validated against the policy's corresponding validator.
        Upon a successful update, the policy's version is incremented by 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'

      responses:
        200:
          $ref: '#/components/responses/UpdatePolicyResponse'
        400:
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        404:
          description:
            Not Found - NoSuchPolicyException, policy to get does not exist
          content:
            application/json:
              schema:
                $ref: './common/polaris-errors.yaml#/components/schemas/PolarisErrorResponse'
              examples:
                PolicyToUpdateDoesNotExist:
                  $ref: '#/components/examples/NoSuchPolicyError'
        419:
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'

    delete:
      tags:
        - Policy API
      summary: Delete a policy from the catalog
      operationId: dropPolicy
      description: Remove a policy from the catalog
      responses:
        204:
          description: Success, no content
        400:
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        404:
          description:
            Not Found - NoSuchPolicyException, policy to get does not exist
          content:
            application/json:
              schema:
                $ref: './common/polaris-errors.yaml#/components/schemas/PolarisErrorResponse'
              examples:
                PolicyToDeleteDoesNotExist:
                  $ref: '#/components/examples/NoSuchPolicyError'
        419:
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'

  /v1/{prefix}/namespaces/{namespace}/policies/{policyName}/mappings:
    parameters:
      - $ref: './common/parameters.yaml#/components/parameters/prefix'
      - $ref: './common/parameters.yaml#/components/parameters/namespace'
      - $ref: '#/components/parameters/policy-name'

    put:
      tags:
        - Policy API
      summary: Create a mapping between a policy and a resource entity
      operationId: setPolicy
      description: |
        Create a mapping between a policy and a resource entity

        Policy can be set at different levels:
        1. **Table-like level:** Policies specific to individual tables, views, or other table-like entities.
        2. **Namespace level:** Policies applies to a namespace.
        3. **Catalog level:** Policies that applies to a catalog

        Additional parameters can be provided in `parameters` when creating a mapping to define specific behavior or constraints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPolicyRequest'

      responses:
        204:
          description: Success, no content
        400:
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        404:
          description:
            Not Found - NoSuchPolicyException, NoSuchEntityException
          content:
            application/json:
              schema:
                $ref: './common/polaris-errors.yaml#/components/schemas/PolarisErrorResponse'
              examples:
                PolicyToSetDoesNotExist:
                  $ref: '#/components/examples/NoSuchPolicyError'
                EntityToSetDoesNotExist:
                  $ref: '#/components/examples/NoSuchEntityError'
        419:
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'

    post:
      tags:
        - Policy API
      summary: Remove a mapping between a policy and a resource entity
      operationId: unsetPolicy
      description: |
        Remove a mapping between a policy and a resource entity
        
        A resource entity can be a catalog, namespace, or any table-like entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsetPolicyRequest'

      responses:
        204:
          description: Success, no content
        400:
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        404:
          description:
            Not Found - NoSuchPolicyException, NoSuchEntityException, NoSuchMappingException
          content:
            application/json:
              schema:
                $ref: './common/polaris-errors.yaml#/components/schemas/PolarisErrorResponse'
              examples:
                PolicyToUnsetDoesNotExist:
                  $ref: '#/components/examples/NoSuchPolicyError'
                EntityToUnsetDoesNotExist:
                  $ref: '#/components/examples/NoSuchEntityError'
                MappingToUnsetDoesNotExist:
                  $ref: '#/components/examples/NoSuchMappingError'
        419:
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'

  /v1/{prefix}/applicablePolicies:
    parameters:
      - $ref: './common/parameters.yaml#/components/parameters/prefix'

    get:
      tags:
        - Policy API
      summary: Get Applicable policies for catalog, namespace, table, or views
      operationId: getApplicablePoliciesUsingParameter
      description: Get Applicable policies for catalog, namespace, table, or views
      parameters:
        - $ref: './common/parameters.yaml#/components/parameters/page-token'
        - $ref: './common/parameters.yaml#/components/parameters/page-size'
        - name: namespace
          in: query
          required: false
          description:
            A namespace identifier as a single string.
            Multipart namespace parts should be separated by the unit separator (`0x1F`) byte.
          schema:
            type: string
          examples:
            singlepart_namespace:
              value: "accounting"
            multipart_namespace:
              value: "accounting%1Ftax"
        - $ref: '#/components/parameters/table-like'
        - $ref: '#/components/parameters/policy-type'

      responses:
        200:
          $ref: '#/components/responses/GetApplicablePoliciesResponse'
        400:
          $ref: './common/polaris-errors.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: './common/polaris-errors.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: './common/polaris-errors.yaml#/components/responses/ForbiddenResponse'
        404: # TODO: need a general error for no such entity No Such Namespace, No Such Table, No Such View
          description:
            Not Found - NoSuchTableException, table to load does not exist
          content:
            application/json:
              schema:
                $ref: './common/polaris-errors.yaml#/components/schemas/PolarisErrorResponse'
              examples:
                TableToLoadDoesNotExist:
                  $ref: './common/polaris-errors.yaml#/components/examples/NoSuchTableError'
        419:
          $ref: './common/polaris-errors.yaml#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: './common/polaris-errors.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: './common/polaris-errors.yaml#/components/responses/ServerErrorResponse'


components:
  parameters:
    policy-name:
      name: policyName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PolicyName'

    policy-type:
      name: policyType
      in: query
      required: false
      allowEmptyValue: true
      schema:
        $ref: '#/components/schemas/PolicyType'

    table-like:
      name: tableLike
      in: query
      required: false
      description: Name of the table like entity
      schema:
        type: string
      example: "table"




  schemas:
    PolicyType:
      description: The type of a policy
      type: string
      nullable: true
      example: system.data-compaction

    PolicyName:
      type: string
      description:
        A policy name. A valid policy name should only consist of uppercase and lowercase letters (A-Z, a-z),
        digits (0-9), hyphens (-), underscores (_).
      pattern: '^[A-Za-z0-9\-_]+$'
      example: 'compaction'

    Policy:
      type: object
      description: |
        A policy in Apache Polaris defines a set of rules for governing access, data usage, and operational consistency across various catalog resources. 
        Policies are stored within Polaris and can be applied to catalogs, namespaces, tables, views, and other table-like entities.
        For example, they can be used for fine-grained control over who can perform specific actions on certain resources.

        The policy object includes
        - **policy-type:** The type of the policy, which determines the expected format and semantics of the policy content.
        - **name:**  A human-readable name for the policy, which must be unique within a given namespace.
        - **description:** Detailed description of the purpose and functionalities of the policy.
        - **content:** Policy content, which can be validated against predefined schemas of a policy type.
        - **version:** Indicates the current version of the policy. Versions increased monotonically, the default value is 0
        - **created_at:** A timestamp (in milliseconds) indicating when the policy was created.
        - **updated_at:** A timestamp (in milliseconds) indicating the last update time of the policy.

        Policies stored in Polaris serve as the persistent definition for access control and governance rules.
      required:
        - policy-type
        - name
        - version
      properties:
        policy-type:
          type: string
        name:
          $ref: '#/components/schemas/PolicyName'
        description:
          type: string
        content:
          type: string
        version:
          type: integer
        created-at-ms:
          type: integer
          format: int64
        updated-at-ms:
          type: integer
          format: int64

    CreatePolicyRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          $ref: '#/components/schemas/PolicyName'
        type:
          type: string
        description:
          type: string
        content:
          type: string

    LoadPolicyResponse:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/Policy'

    UpdatePolicyRequest:
      type: object
      properties:
        description:
          type: string
        content:
          type: string

    SetPolicyRequest:
      type: object
      required:
        - entity
      properties:
        entity:
          $ref: '#/components/schemas/EntityIdentifier'
        parameters:
          type: object
          additionalProperties:
            type: string

    UnsetPolicyRequest:
      type: object
      required:
        - entity
      properties:
        entity:
          $ref: '#/components/schemas/EntityIdentifier'


    PolicyIdentifier:
      type: object
      required:
        - namespace
        - name
      properties:
        namespace:
          $ref: './common/models.yaml#/components/schemas/Namespace'
        name:
          type: string
          nullable: false

    CatalogIdentifier:
      allOf:
        - $ref: '#/components/schemas/EntityIdentifier'
        - type: object
          required:
            - catalog
          properties:
            catalog:
              type: string

    NamespaceIdentifier:
      allOf:
        - $ref: '#/components/schemas/EntityIdentifier'
        - type: object
          required:
            - catalog
            - namespace
          properties:
            catalog:
              type: string
              nullable: false
            namespace:
              $ref: './iceberg-rest-catalog-open-api.yaml#/components/schemas/Namespace'

    TableLikeIdentifier:
      allOf:
        - $ref: '#/components/schemas/EntityIdentifier'
        - type: object
          required:
            - catalog
            - namespace
            - name
          properties:
            catalog:
              type: string
              nullable: false
            namespace:
              $ref: './iceberg-rest-catalog-open-api.yaml#/components/schemas/Namespace'
            name:
              type: string
              nullable: false

    EntityIdentifier:
      type: object
      discriminator:
        propertyName: type
        mapping:
          catalog: '#/components/schemas/CatalogIdentifier'
          namespace: '#/components/schemas/NamespaceIdentifier'
          table-like: '#/components/schemas/TableLikeIdentifier'
      properties:
        type:
          type: string
          enum:
            - catalog
            - namespace
            - table-like
      required:
        - type

    GetApplicablePoliciesResponse:
      type: object
      required:
        - policies
      properties:
        next-page-token:
          $ref: './iceberg-rest-catalog-open-api.yaml#/components/schemas/PageToken'
        policies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Policy'

    ListPoliciesResponse:
      type: object
      properties:
        next-page-token:
          $ref: './iceberg-rest-catalog-open-api.yaml#/components/schemas/PageToken'
        identifiers:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyIdentifier'



  responses:
    CreatePolicyResponse:
      description: Policy object result after creating a policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadPolicyResponse'

    LoadPolicyResponse:
      description: Policy object result when getting a policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadPolicyResponse'

    UpdatePolicyResponse:
      description:
        Response used when a policy is successfully updated

        The updated policy JSON is returned in the policy field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadPolicyResponse'

    ListPoliciesResponse:
      description: a list of policy identifiers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListPoliciesResponse'
          examples:
            ListPoliciesResponseNonEmpty:
              $ref: '#/components/examples/ListPoliciesNonEmptyExample'
            ListPoliciesResponseEmpty:
              $ref: '#/components/examples/ListPoliciesEmptyExample'


    GetApplicablePoliciesResponse:
      description: A list of policies applicable to the table
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetApplicablePoliciesResponse'



  examples:
    NoSuchPolicyError:
      summary: The requested policy does not exist
      value: {
        "error": {
          "message": "The given policy does not exist",
          "type": "NoSuchPolicyException",
          "code": 404
        }
      }

    NoSuchEntityError:
      summary: The requested entity does not exist
      value: {
        "error": {
          "message": "The given entity does not exist",
          "type": "NoSuchEntityException",
          "code": 404
        }
      }

    NoSuchMappingError:
      summary: The requested mapping between policy and entity does not exist
      value: {
        "error": {
          "message": "The given mapping between policy and entity does not exist",
          "type": "NoSuchMappingException",
          "code": 404
        }
      }

    ListPoliciesNonEmptyExample:
      summary: A non-empty list of policy identifiers
      value:
        identifiers:
          - namespace:
              - accounting
              - tax
            name: policy1
          - namespace:
              - accounting
              - tax
            name: policy2

    ListPoliciesEmptyExample:
      summary: An empty list for a namespace with no policies
      value:
        identifiers: [ ]

  securitySchemes:

    # The OAuth2 scheme is sourced from iceberg-rest-catalog-open-api.yaml
    #
    # If the /v1/oauth/tokens endpoint is removed or modified
    # (see https://github.com/apache/polaris/issues/12),
    # the scheme must be updated accordingly.
    OAuth2:
      type: oauth2
      description:
        This scheme is used for OAuth2 authorization.
        
        
        For unauthorized requests, services should return an appropriate 401 or
        403 response. Implementations must not return altered success (200)
        responses when a request is unauthenticated or unauthorized.
        
        If a separate authorization server is used, substitute the tokenUrl with
        the full token path of the external authorization server, and use the
        resulting token to access the resources defined in the spec.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/tokens
          scopes:
            catalog: Allows interacting with the Config and Catalog APIs

    BearerAuth:
      $ref: './iceberg-rest-catalog-open-api.yaml#/components/securitySchemes/BearerAuth'
